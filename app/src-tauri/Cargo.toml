[package]
name = "ncd"
version = "2.0.0"
description = "NoClickDock: every status you need, with no click"
authors = ["Shiny Studio"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library's name apart from the `ncd` binary;
# on Windows they would otherwise collide (cargo #8519).
name = "ncd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
